name: Windows build
on:
  push:
    branches: [main, version-0.2, version-0.3, version-0.4, version-0.5, version-0.5.1, version-0.6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Core tests
        run: python -m unittest discover -s tests -v
      - name: Source integration check
        run: python main.py --self-test source-check.json
      - name: Scoreboard OCR integration
        run: python scripts/check_ocr.py
      - name: Desktop workflow and layout check
        if: ${{ !cancelled() }}
        run: python scripts/check_gui.py
      - name: Build and verify Windows application
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoEditor-Windows
          path: dist/AutoEditor-*-Windows.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics
          path: |
            source-check.json
            build/bundle-check.json
            build/AutoEditor/warn-AutoEditor.txt
            build/gui-*.jpg
            build/gui-check.json
            build/ocr-check.json
          if-no-files-found: ignore
          retention-days: 14
